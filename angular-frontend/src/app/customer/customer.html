<div class="bg-white rounded-lg shadow-md p-6 mb-6">
  <h2 class="text-2xl font-semibold mb-4">Customer Info</h2>
  
  <div class="space-y-6">
    <!-- Contact Information -->
    <div>
      <h3 class="text-lg font-medium mb-3">Contact Information</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" [(ngModel)]="customerInfo.email" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="customer@example.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
          <input type="tel" [(ngModel)]="customerInfo.phone" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="(555) 555-5555">
        </div>
      </div>
    </div>

    <!-- Personal Information -->
    <div>
      <h3 class="text-lg font-medium mb-3">Personal Information</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
          <input type="text" [(ngModel)]="customerInfo.firstName" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="John">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
          <input type="text" [(ngModel)]="customerInfo.lastName" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="Doe">
        </div>
      </div>
    </div>

    <!-- Shipping Address -->
    <div>
      <h3 class="text-lg font-medium mb-3">Shipping Address</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Street Address</label>
          <input type="text" [(ngModel)]="customerInfo.address" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="123 Main St">
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
            <input type="text" [(ngModel)]="customerInfo.city" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="New York">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">State</label>
            <input type="text" [(ngModel)]="customerInfo.state" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="NY">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">ZIP Code</label>
            <input type="text" [(ngModel)]="customerInfo.zipCode" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="10001">
          </div>
        </div>
      </div>
    </div>

    <!-- Payment Information -->
    <div>
      <h3 class="text-lg font-medium mb-3">Payment Information</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Card Number</label>
          <input type="text" [(ngModel)]="payment.cardNumber" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="1">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Expiry (MMYY)</label>
          <input type="text" [(ngModel)]="payment.expiry" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="1226">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">CVV</label>
          <input type="text" [(ngModel)]="payment.cvv" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="123">
        </div>
      </div>
    </div>

    <!-- Save Button -->
    <div>
      <button (click)="saveCustomerInfo()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded">Save Customer Info</button>
    </div>
  </div>
</div>
