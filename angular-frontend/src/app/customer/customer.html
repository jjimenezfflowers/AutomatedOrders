<ui-card>
  <ui-card-content class="space-y-8">
    <section>
      <h3 class="mb-4 border-b border-border pb-2 text-sm font-semibold text-foreground">Contact Information</h3>
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <ui-field label="Email" controlId="customer-email" [error]="errors['email']">
          <ui-input
            type="email"
            inputId="customer-email"
            name="email"
            autocomplete="email"
            placeholder="customer@example.com"
            [(ngModel)]="customerInfo.email"
            [invalid]="!!errors['email']"
            (focusout)="onFieldBlur('email')"
            (input)="onFieldInput('email')"
            testId="customer-email"
          />
        </ui-field>
        <ui-field label="Phone" controlId="customer-phone" [error]="errors['phone']">
          <ui-input
            type="tel"
            inputId="customer-phone"
            name="phone"
            autocomplete="tel"
            placeholder="(555) 555-5555"
            [(ngModel)]="customerInfo.phone"
            [invalid]="!!errors['phone']"
            (focusout)="onFieldBlur('phone')"
            (input)="onFieldInput('phone')"
            testId="customer-phone"
          />
        </ui-field>
      </div>
    </section>

    <section>
      <h3 class="mb-4 border-b border-border pb-2 text-sm font-semibold text-foreground">Personal Information</h3>
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <ui-field label="First Name" controlId="customer-first-name" [error]="errors['firstName']">
          <ui-input
            inputId="customer-first-name"
            name="firstName"
            autocomplete="given-name"
            placeholder="John"
            [(ngModel)]="customerInfo.firstName"
            [invalid]="!!errors['firstName']"
            (focusout)="onFieldBlur('firstName')"
            (input)="onFieldInput('firstName')"
            testId="customer-first-name"
          />
        </ui-field>
        <ui-field label="Last Name" controlId="customer-last-name" [error]="errors['lastName']">
          <ui-input
            inputId="customer-last-name"
            name="lastName"
            autocomplete="family-name"
            placeholder="Doe"
            [(ngModel)]="customerInfo.lastName"
            [invalid]="!!errors['lastName']"
            (focusout)="onFieldBlur('lastName')"
            (input)="onFieldInput('lastName')"
            testId="customer-last-name"
          />
        </ui-field>
      </div>
    </section>

    <section>
      <h3 class="mb-4 border-b border-border pb-2 text-sm font-semibold text-foreground">Shipping Address</h3>

      <div class="mb-3 flex flex-wrap gap-2">
        @for (preset of addressPresets; track preset.code) {
          <ui-button
            variant="elevated"
            size="xs"
            (click)="setAddress(preset.code)"
            [testId]="'address-preset-' + preset.code"
          >
            {{ preset.label }}
          </ui-button>
        }
      </div>

      <div class="space-y-4">
        <ui-field label="Street Address" controlId="customer-address" [error]="errors['address']">
          <ui-input
            inputId="customer-address"
            name="address"
            autocomplete="street-address"
            placeholder="123 Main St"
            [(ngModel)]="customerInfo.address"
            [invalid]="!!errors['address']"
            (focusout)="onFieldBlur('address')"
            (input)="onFieldInput('address')"
            testId="customer-address"
          />
        </ui-field>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
          <ui-field label="City" controlId="customer-city" [error]="errors['city']">
            <ui-input
              inputId="customer-city"
              name="city"
              autocomplete="address-level2"
              placeholder="New York"
              [(ngModel)]="customerInfo.city"
              [invalid]="!!errors['city']"
              (focusout)="onFieldBlur('city')"
              (input)="onFieldInput('city')"
              testId="customer-city"
            />
          </ui-field>
          <ui-field label="State" controlId="customer-state" [error]="errors['state']">
            <ui-input
              inputId="customer-state"
              name="state"
              autocomplete="address-level1"
              placeholder="NY"
              [(ngModel)]="customerInfo.state"
              [invalid]="!!errors['state']"
              (focusout)="onFieldBlur('state')"
              (input)="onFieldInput('state')"
              testId="customer-state"
            />
          </ui-field>
          <ui-field label="ZIP Code" controlId="customer-zip" [error]="errors['zipCode']">
            <ui-input
              inputId="customer-zip"
              name="zipCode"
              autocomplete="postal-code"
              placeholder="10001"
              [(ngModel)]="customerInfo.zipCode"
              [invalid]="!!errors['zipCode']"
              (focusout)="onFieldBlur('zipCode')"
              (input)="onFieldInput('zipCode')"
              testId="customer-zip"
            />
          </ui-field>
        </div>
      </div>
    </section>

    <section>
      <h3 class="mb-4 border-b border-border pb-2 text-sm font-semibold text-foreground">Payment Information</h3>
      <ui-alert variant="info" class="mb-3">
        Test card details for automated checkout runs. Never enter a real card here.
      </ui-alert>
      <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
        <ui-field label="Card Number" controlId="payment-card" class="md:col-span-2" [error]="errors['cardNumber']">
          <ui-input
            inputId="payment-card"
            name="cardNumber"
            autocomplete="off"
            placeholder="4242424242424242"
            [(ngModel)]="payment.cardNumber"
            [invalid]="!!errors['cardNumber']"
            (focusout)="onFieldBlur('cardNumber')"
            (input)="onFieldInput('cardNumber')"
            testId="payment-card"
          />
        </ui-field>
        <ui-field label="Expiry (MMYY)" controlId="payment-expiry" [error]="errors['expiry']">
          <ui-input
            inputId="payment-expiry"
            name="expiry"
            autocomplete="off"
            placeholder="1226"
            [(ngModel)]="payment.expiry"
            [invalid]="!!errors['expiry']"
            (focusout)="onFieldBlur('expiry')"
            (input)="onFieldInput('expiry')"
            testId="payment-expiry"
          />
        </ui-field>
        <ui-field label="CVV" controlId="payment-cvv" [error]="errors['cvv']">
          <ui-input
            inputId="payment-cvv"
            name="cvv"
            autocomplete="off"
            placeholder="123"
            [(ngModel)]="payment.cvv"
            [invalid]="!!errors['cvv']"
            (focusout)="onFieldBlur('cvv')"
            (input)="onFieldInput('cvv')"
            testId="payment-cvv"
          />
        </ui-field>
      </div>
    </section>
  </ui-card-content>

  <ui-card-footer>
    <ui-button (click)="saveCustomerInfo()" [loading]="isSaving" testId="save-customer">
      Save Customer Info
    </ui-button>
  </ui-card-footer>
</ui-card>
