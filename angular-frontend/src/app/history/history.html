<ui-card>
  <ui-card-content>
    @if (!loading() && history().length === 0) {
      <div class="flex flex-col items-center justify-center gap-3 px-6 py-8">
        <div class="flex size-10 items-center justify-center rounded-full bg-muted text-muted-foreground">
          <lucide-angular [img]="icons.history" class="size-5" aria-hidden="true" />
        </div>
        <span class="text-sm font-semibold text-foreground">No orders placed yet</span>
        <span class="w-[360px] text-center text-xs text-muted-foreground">
          Runs started from the Orders tab appear here once they complete.
        </span>
      </div>
    } @else {
      <ui-data-table
        testId="history"
        searchPlaceholder="Search order number or customer..."
        [data]="history()"
        [columns]="columns"
        [loading]="loading()"
      >
        <ng-template uiDataTableCell="orderNumber" let-entry>
          @if (entry.orderNumber) {
            <span class="font-semibold text-foreground">#{{ entry.orderNumber }}</span>
          } @else {
            <span class="font-semibold italic text-muted-foreground">order number not captured</span>
          }
        </ng-template>

        <ng-template uiDataTableCell="environment" let-entry let-label="value">
          <ui-badge [variant]="entry.environment === 'staging' ? 'warning' : 'success'">
            {{ label }}
          </ui-badge>
        </ng-template>

        <ng-template uiDataTableCell="date" let-entry>
          <span class="text-sm text-muted-foreground">{{ formatDate(entry.date) }}</span>
        </ng-template>

        <ng-template uiDataTableCell="products" let-entry let-count="value">
          <!-- The full list lives in the tooltip: a bulleted list does not fit a table row. -->
          <span class="cursor-help text-sm text-muted-foreground" [title]="productSummary(entry)">
            {{ count }} product(s)
          </span>
        </ng-template>
      </ui-data-table>
    }
  </ui-card-content>
</ui-card>
