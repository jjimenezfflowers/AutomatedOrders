<div class="bg-white rounded-lg shadow-md p-6 mb-6">
  <h2 class="text-2xl font-semibold mb-4">Products</h2>
  <button (click)="addProduct()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded mb-4">+ Add Product</button>
  <div class="space-y-4">
    <div *ngFor="let product of products; let i = index" class="border border-gray-300 rounded-lg p-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Product ID</label>
          <input type="text" [(ngModel)]="product.id" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="e.g., floreana-white-spray-roses">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
          <input type="text" [(ngModel)]="product.name" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="e.g., Floreana White Spray Roses">
        </div>
        <div class="col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">URL</label>
          <input type="text" [(ngModel)]="product.url" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="https://example.com/product">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Variant Selector <span class="text-gray-500 text-xs">(optional)</span></label>
          <input type="text" [(ngModel)]="product.variantSelector" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="#option-0">
        </div>
        <div class="col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
          <select [(ngModel)]="product.type" class="w-full px-3 py-2 border border-gray-300 rounded mb-2">
            <option value="">Simple Product</option>
            <option value="product-options">Product with Options</option>
          </select>
          
          <label class="block text-sm font-medium text-gray-700 mb-1">Variants <span class="text-gray-500 text-xs">(one per line, optional)</span></label>
          <textarea [(ngModel)]="product.variantsText" 
                    (ngModelChange)="updateVariants(product)"
                    rows="3" 
                    class="w-full px-3 py-2 border border-gray-300 rounded text-sm" 
                    placeholder="20 stems (2 Bunches)&#10;50 stems (5 Bunches)&#10;100 stems (10 Bunches)"></textarea>
          
          @if (product.type === 'product-options') {
            <div class="mt-2 p-3 bg-blue-50 rounded border border-blue-200">
              <p class="text-sm text-blue-800">ℹ️ Product Options: Edit products.json directly to configure</p>
            </div>
          }
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Default Variant <span class="text-gray-500 text-xs">(optional)</span></label>
          <input type="text" [(ngModel)]="product.defaultVariant" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="20 stems">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Quantity Selector</label>
          <input type="text" [(ngModel)]="product.quantitySelector" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="#quantity-123">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Default Quantity</label>
          <input type="number" [(ngModel)]="product.defaultQuantity" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="1">
        </div>
      </div>
      <button (click)="deleteProduct(i)" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm mt-3">Delete</button>
    </div>
  </div>
  <button (click)="saveProducts()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded mt-4">Save Products</button>
</div>
