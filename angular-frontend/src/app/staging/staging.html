<ui-card>
  <ui-card-header>
    <ui-card-title>Staging Testing</ui-card-title>
    <ui-card-description>
      Run order tests against a staging store. Product paths are preserved — only the base domain is
      replaced.
    </ui-card-description>
  </ui-card-header>

  <ui-card-content class="space-y-4">
    <ui-field
      label="Staging Base URL"
      controlId="staging-base-url"
      hint="Replaces the domain in all product URLs when the test runs, e.g. https://staging.example.com"
    >
      <ui-input
        type="url"
        inputId="staging-base-url"
        name="stagingBaseUrl"
        placeholder="https://staging-store.myshopify.com"
        [(ngModel)]="stagingConfig.stagingBaseUrl"
        testId="staging-base-url"
      />
    </ui-field>

    <div class="flex flex-wrap gap-3">
      <ui-button variant="outline" (click)="saveConfig()" testId="save-staging-config">
        <lucide-angular [img]="icons.save" class="size-4" aria-hidden="true" />
        Save Config
      </ui-button>
      <ui-button
        variant="warning"
        (click)="runStagingTest()"
        [loading]="isRunning"
        [disabled]="!stagingConfig.stagingBaseUrl"
        testId="run-staging-test"
      >
        @if (!isRunning) {
          <lucide-angular [img]="icons.run" class="size-4" aria-hidden="true" />
        }
        Run Staging Test
      </ui-button>
    </div>

    @if (testOutput) {
      <div>
        <h3
          class="mb-2 flex items-center gap-1.5 text-sm font-semibold"
          [class.text-success]="testSuccess === true"
          [class.text-destructive]="testSuccess === false"
        >
          <lucide-angular
            [img]="testSuccess ? icons.passed : icons.failed"
            class="size-4"
            aria-hidden="true"
          />
          {{ testSuccess ? 'Test passed' : 'Test failed' }}
        </h3>
        <!-- Console output keeps a fixed dark surface in both themes; it reads as terminal output. -->
        <pre
          class="max-h-96 overflow-auto rounded bg-gray-900 p-4 text-xs whitespace-pre-wrap text-gray-100"
          >{{ testOutput }}</pre
        >
      </div>
    }
  </ui-card-content>
</ui-card>
