<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Manager - Playwright Automation</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="container mx-auto px-4 py-8">
    <h1 class="text-4xl font-bold text-gray-800 mb-8">🌸 Order Manager</h1>
    
    <!-- Tabs -->
    <div class="mb-6 border-b border-gray-200">
      <nav class="flex space-x-4">
        <button onclick="showTab('products')" id="tab-products" class="tab-btn px-4 py-2 font-medium text-blue-600 border-b-2 border-blue-600">Products</button>
        <button onclick="showTab('orders')" id="tab-orders" class="tab-btn px-4 py-2 font-medium text-gray-500 hover:text-gray-700">Orders</button>
        <button onclick="showTab('customer')" id="tab-customer" class="tab-btn px-4 py-2 font-medium text-gray-500 hover:text-gray-700">Customer Info</button>
        <button onclick="showTab('history')" id="tab-history" class="tab-btn px-4 py-2 font-medium text-gray-500 hover:text-gray-700">History</button>
      </nav>
    </div>

    <!-- Products Tab -->
    <div id="content-products" class="tab-content">
      <div class="bg-white rounded-lg shadow-md p-6 mb-6">
        <h2 class="text-2xl font-semibold mb-4">Products</h2>
        <button onclick="addProduct()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded mb-4">+ Add Product</button>
        <div id="products-list" class="space-y-4"></div>
        <button onclick="saveProducts()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded mt-4">Save Products</button>
      </div>
    </div>

    <!-- Orders Tab -->
    <div id="content-orders" class="tab-content hidden">
      <div class="bg-white rounded-lg shadow-md p-6 mb-6">
        <h2 class="text-2xl font-semibold mb-4">Create Order</h2>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">Delivery Date</label>
          <input type="date" id="deliveryDate" class="w-full px-3 py-2 border border-gray-300 rounded" title="Select delivery date">
        </div>
        <div class="mb-4">
          <h3 class="text-lg font-medium mb-2">Available Products</h3>
          <div id="product-selection" class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4 p-4 bg-gray-50 rounded-lg"></div>
          <h3 class="text-lg font-medium mb-2">Selected Products</h3>
          <div id="order-items" class="space-y-3"></div>
        </div>
        <div class="flex space-x-4">
          <button onclick="saveOrder()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded">Save Order</button>
          <button onclick="runTest()" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-2 rounded">🚀 Place Order</button>
        </div>
      </div>
      <div id="test-output" class="bg-gray-800 text-green-400 rounded-lg p-4 font-mono text-sm hidden"></div>
    </div>

    <!-- Customer Tab -->
    <div id="content-customer" class="tab-content hidden">
      <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="text-2xl font-semibold mb-4">Customer Information</h2>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
            <input type="email" id="email" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="customer@example.com">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Phone</label>
            <input type="tel" id="phone" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="(123) 456-7890">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
            <input type="text" id="firstName" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="John">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
            <input type="text" id="lastName" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="Doe">
          </div>
          <div class="col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-2">Address</label>
            <input type="text" id="address" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="123 Main St">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">City</label>
            <input type="text" id="city" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="New York">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">State</label>
            <input type="text" id="state" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="NY">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Zip Code</label>
            <input type="text" id="zipCode" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="10001">
          </div>
        </div>
        <h3 class="text-xl font-semibold mt-6 mb-4">Payment Information</h3>
        <div class="grid grid-cols-3 gap-4">
          <div class="col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-2">Card Number</label>
            <input type="text" id="cardNumber" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="1234 5678 9012 3456">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">CVV</label>
            <input type="text" id="cvv" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="123">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Expiry (MMYY)</label>
            <input type="text" id="expiry" placeholder="1226" class="w-full px-3 py-2 border border-gray-300 rounded">
          </div>
        </div>
        <button onclick="saveCustomer()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded mt-6">Save Customer Info</button>
      </div>
    </div>

    <!-- History Tab -->
    <div id="content-history" class="tab-content hidden">
      <div class="bg-white rounded-lg shadow-md p-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-semibold">Order History</h2>
          <button onclick="loadHistory()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">🔄 Refresh</button>
        </div>
        <div id="history-list" class="space-y-4"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
